[build]
  publish   = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from   = "/medical"
  to     = "/medical.html"
  status = 200

[[redirects]]
  from   = "/tradies"
  to     = "/tradies.html"
  status = 200

[[redirects]]
  from   = "/beauty"
  to     = "/beauty.html"
  status = 200

[[redirects]]
  from   = "/get-started"
  to     = "/get-started.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "DENY"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "microphone=self, camera=()"
