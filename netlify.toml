[build]
  publish   = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from   = "/medical"
  to     = "/medical.html"
  status = 200

[[redirects]]
  from   = "/tradies"
  to     = "/tradies.html"
  status = 200

[[redirects]]
  from   = "/beauty"
  to     = "/beauty.html"
  status = 200

[[redirects]]
  from   = "/get-started"
  to     = "/get-started.html"
  status = 200

# medical-dental-clinics.html was a ~98% duplicate of medical.html (same
# title, same FAQ, same everything but a logo swap) living at a second
# indexable URL — split ranking signal for the same query. /medical is the
# newer, intended canonical (see the rewrite above); permanently redirect
# both URL forms of the old page to it so search engines consolidate.
[[redirects]]
  from   = "/medical-dental-clinics"
  to     = "/medical"
  status = 301

[[redirects]]
  from   = "/medical-dental-clinics.html"
  to     = "/medical"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "DENY"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "microphone=self, camera=()"
