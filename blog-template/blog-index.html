<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | ELLIE AI Receptionist — Missed Calls, Bookings & Business Growth</title>
  <meta name="description" content="Practical guides for Australian businesses on handling calls, capturing more bookings and never missing a customer. From the team behind Ellie.">
  <link rel="canonical" href="https://callellie.com/blog/">
  <link rel="stylesheet" href="/blog/assets/blog.css">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-3DDVZ866F9"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-3DDVZ866F9');
</script>
</head>
<body>
  <header class="site">
    <a class="brand" href="/">
      <img src="../assets/ellie/logo.png" alt="Ellie AI Receptionist">
    </a>
    <a class="cta" href="/#book">Try Free for 7 Days</a>
  </header>
  <main class="index-wrap">
    <div class="page-head">
      <h1>Australia's #1 Business Owner's Guide</h1>
      <p class="sub">Articles and guides for small/medium business owners.</p>
    </div>
    <div class="posts-grid" id="posts"></div>
  </main>
  <footer>
    <p>&copy; ELLIE AI Receptionist · <a href="https://callellie.com">callellie.com</a> · From $199/month · Built in Australia</p>
  </footer>
  <script>
    fetch('/blog/index.json')
      .then(r => r.json())
      .then(posts => {
        document.getElementById('posts').innerHTML = posts.map(p => `
          <a class="post-card" href="${p.url}">
            ${p.image ? `<div class="thumb"><img src="${p.image}" alt="" loading="lazy"></div>` : ''}
            <div class="card-body">
              <div class="date">${new Date(p.date).toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' })}</div>
              <h2>${p.title}</h2>
              <p>${p.description}</p>
              <span class="read-more">Read article &rarr;</span>
            </div>
          </a>
        `).join('');
      });
  </script>
</body>
</html>
