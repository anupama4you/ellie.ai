name: Leads — Find

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'Optional custom query list separated by "|"'
        required: false
      target_new_leads:
        description: "Target number of NEW leads to add"
        required: false
        default: "100"
      max_results:
        description: "Max Places candidates per query (Google hard-caps at 60)"
        required: false
        default: "60"
  schedule:
    # Weekday mornings for Adelaide. 22:30 UTC Sun-Thu is 08:00 ACST / 09:00 ACDT the next day.
    - cron: "30 22 * * 0-4"

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-save googleapis

      - name: Run Google Places lead finder
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          OUTREACH_PIPELINE_SPREADSHEET_ID: "1oLv8_GvF4I1oEXkh0g0YjnukrQ5Y56UULriT1A4WwNE"
          OUTREACH_PIPELINE_TAB: "Email Queue"
          SEARCH_QUERY: ${{ inputs.search_query || '' }}
          MAX_RESULTS: ${{ inputs.max_results || '60' }}
          TARGET_NEW_LEADS: ${{ inputs.target_new_leads || '100' }}
        run: node scripts/leads-find.js
