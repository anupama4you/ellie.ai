name: Leads — Find

# Manual only, on purpose — this appends candidate leads + drafted
# SMS/email messages to the tracking sheet. It never sends anything itself.
on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'One query, or several separated by "|" (Google only returns up to 60 results per query, so use one per suburb to go beyond that), e.g. "plumber in Adelaide|plumber in Mount Gambier|plumber in Whyalla"'
        required: true
      target_new_leads:
        description: "Stop once this many NEW leads have been added — works through the query list above until met or exhausted"
        required: false
        default: "100"
      max_results:
        description: "Max candidates to pull per individual query (hard-capped at 60 by Google's Places API)"
        required: false
        default: "60"

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-save googleapis

      - name: Run lead finder
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          SEARCH_QUERY: ${{ inputs.search_query }}
          MAX_RESULTS: ${{ inputs.max_results }}
          TARGET_NEW_LEADS: ${{ inputs.target_new_leads }}
        run: node scripts/leads-find.js
