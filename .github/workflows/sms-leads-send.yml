name: SMS Leads — Send Approved

on:
  workflow_dispatch:
    inputs:
      max_per_run:
        description: "Safety cap on how many SMS messages this run can send"
        required: false
        default: "50"

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-save googleapis

      - name: Run unified outreach SMS sender
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          OUTREACH_PIPELINE_SPREADSHEET_ID: "1oLv8_GvF4I1oEXkh0g0YjnukrQ5Y56UULriT1A4WwNE"
          OUTREACH_PIPELINE_TAB: "Email Queue"
          TEXTO_API_KEY: ${{ secrets.TEXTO_API_KEY }}
          TEXTO_SENDER: ${{ secrets.TEXTO_SENDER }}
          SMS_MAX_PER_RUN: ${{ inputs.max_per_run || '50' }}
        run: node scripts/sms-leads-send.js
