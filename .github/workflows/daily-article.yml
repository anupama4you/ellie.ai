name: SEO Article (every 2 days)

on:
  schedule:
    # 21:30 UTC = ~7:00am ACST Adelaide (8:00am ACDT in summer), every 2 days.
    # Cron's day-of-month "*/2" resets at 1 each month rather than counting a
    # true rolling 48h, so months ending on day 31 (odd) butt up against the
    # next month's day 1 (also odd) with only a 1-day gap — 7 times a year.
    # Not worth extra infra to fix; worst case is one article a day early.
    - cron: "30 21 */2 * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SITE_URL: https://callellie.com
        run: node scripts/generate-article.js

      - name: Commit and push
        run: |
          git config user.name "ellie-seo-bot"
          git config user.email "bot@callellie.com"
          git add blog/ content-queue/ sitemap-blog.xml
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore: SEO article $(date +%F)"
          git push
