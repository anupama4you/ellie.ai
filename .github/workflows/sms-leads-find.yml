name: SMS Leads — Find

# Manual only, on purpose — this appends candidate leads + drafted
# messages to the tracking sheet. It never sends anything itself.
on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'Google Places text search, e.g. "hair salon in Adelaide"'
        required: true
      max_results:
        description: "Max businesses to scan this run (capped at 60)"
        required: false
        default: "20"

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-save googleapis

      - name: Run lead finder
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          SEARCH_QUERY: ${{ inputs.search_query }}
          MAX_RESULTS: ${{ inputs.max_results }}
        run: node scripts/sms-leads-find.js
